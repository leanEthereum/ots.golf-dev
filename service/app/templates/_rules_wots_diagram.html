<figure class="rules-diagram wots-diagram">
  <svg viewBox="0 0 420 182" role="img" aria-labelledby="wots-figure-title wots-figure-desc">
    <title id="wots-figure-title">A signature reveals one value from each hash chain</title>
    <desc id="wots-figure-desc">Four hash chains of three steps, from a secret on the left to a public
    end on the right. The message sets the digits 1, 3, 0 and 2, one per chain; the signature reveals
    the value at that digit, and the verifier hashes forward to the public end. The digits sum to 6.</desc>
    <defs>
      <marker id="wots-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z"/></marker>
      <marker id="wots-verify-arrow" class="wots-verify-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z"/></marker>
    </defs>
    <g class="diagram-note" text-anchor="middle">
      <text x="100" y="16">secret</text>
      <text x="370" y="16">public</text>
    </g>
    {% for digit in [1, 3, 0, 2] %}
    {% set y = 40 + 34 * loop.index0 %}
    <g class="wots-chain">
      <text class="diagram-text" x="8" y="{{ y + 5 }}">d<tspan class="diagram-sub" dy="4">{{ loop.index }}</tspan><tspan dy="-4"> = {{ digit }}</tspan></text>
      {% for step in range(3) %}
      <path class="diagram-edges{% if step >= digit %} wots-verify{% endif %}"
            d="M{{ 100 + 90 * step + 11 }} {{ y }} H{{ 100 + 90 * (step + 1) - 11 }}"
            marker-end="url(#{{ 'wots-verify-arrow' if step >= digit else 'wots-arrow' }})"/>
      {% endfor %}
      {% for step in range(4) %}
      <circle class="diagram-node{% if step == digit %} diagram-reveal{% endif %}" cx="{{ 100 + 90 * step }}" cy="{{ y }}" r="9"/>
      {% endfor %}
    </g>
    {% endfor %}
    <text class="diagram-note" x="370" y="176" text-anchor="middle">1 + 3 + 0 + 2 = 6</text>
  </svg>
  <figcaption>The message sets one digit per chain. The signature reveals the value at that digit
  (filled), and the verifier hashes forward to the public end. The digits always sum to the same
  target, so no digit can be raised without lowering another, which would mean inverting the hash.</figcaption>
</figure>
